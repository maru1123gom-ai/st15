<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex2</title>
  <link rel="stylesheet" href="../reset.css">
  <style>
    .wrap{margin: 50px;}
    .container{

      background-color: #fcc;
    }
    .item{
      border: 1px solid #000;

    }

    .flex1{
      width: 300px;
      height: 150px;
      flex-direction: row;
      flex-wrap: wrap;
      column-gap: 1rem;
      row-gap: 10px;
      justify-content: start;
      align-content: start;
      display: flex;
      margin-bottom: 50px;

    }
    .flex1 .item{
      width: 80px;
      flex-grow: 0;
      flex-shrink: 0;
    }
    .flex2{
      display: flex;
      width: 300px;
      height: 150px;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-evenly;
      align-content: space-evenly;
    }
    .flex2 .item{
      flex-grow: 0;
      flex-shrink: 0;
      /* width: calc(33.33% - (1rem *(3 - 1) / 3)); */
      width: 80px;
      height: 60px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container flex1">
      <div class="item">lorem</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
        <div class="container flex2">
      <div class="item">lorem</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
  </div>
</body>
</html>
