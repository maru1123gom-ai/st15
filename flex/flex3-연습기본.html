<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex2</title>
  <link rel="stylesheet" href="../reset.css">
  <style>
    .wrap{margin: 50px;}
    .container{

      width: 300px;
      background-color: #fcc;
    }
    .item{
      border: 1px solid #000;
      
    }
    
    .flex{
      width: 300px;
      height: 300px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      column-gap: 1rem;
      row-gap: 10px;
      justify-content: start;
      /* align-content: stretch; */
      align-content: start;

    }
    .flex .item{
      flex-grow: 0;
      flex-shrink: 0;
      width: 80px;

    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container flex">
      <div class="item">lorem</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
  </div>
</body>
</html>
