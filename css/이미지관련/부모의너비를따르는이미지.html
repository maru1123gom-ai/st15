<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부모의 너비를 따르는 이미지</title>
  <style>
    *{margin: 0; padding: 0;}
    .wrap{margin: 30px;}
    .img-wrap{
      background-color: red;
    }
    .img-wrap img{
      width: 100%;
      /* height: auto; */
      display: block;
      opacity: 0.5;
    }
    .max-img{
      width: 80%;
      background-color: green;
    }
    .max-img img{
      opacity: 0.5;
      /* width: 100%; */
      max-width: 100%;
    }
    .img-wrap2{
      background-color: blue;
      height: 300px;

    }
    .img-wrap2 img{
      opacity: 0.5;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="img-wrap">
      <img src="../images/smartbanner-01-01-pc.png" alt="원피스할인이벤트">
    </div>
  
  <div class="max-img">
    <img src="../images/test.png" alt="">
  </div>
  <div class="img-wrap2">
    <img src="../images/test.png" alt="">
  </div>
  </div>
</body>
</html>
