<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 반응형으로 가져오기-박스모델의이해</title>
  <style>
    *{margin: 0; padding: 0;}
    body{margin: 50px;}
    .media-box{max-width: 768px;
    background-color: #bbb;}
    .iframe-wrap{
      background-color: #ccf;
      width: 500px; height: 500px;
      padding-top: 500px;
      box-sizing: border-box;
      /* overflow: hidden; */
      position: relative;
    }
    .iframe-wrap .box{
      opacity: 0.5;
      background-color: #f00;
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div class="media-box">
    <div class="iframe-wrap">
      <div class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi aperiam, debitis beatae expedita corporis quo. Dolorum, eius dicta dolore ipsum corrupti atque nam ducimus autem itaque consequuntur ad quisquam mollitia!</div>

    </div>
    

    </div>
    </div>
  </div>
</body>
</html>
