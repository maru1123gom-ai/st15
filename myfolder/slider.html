
    <!-- Slider main container -->
    <div class="section visual-section">
      <div class="swiper swiper1">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=1" />
              <span>1번 슬라이드</span>
            </a>
          </div>
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=2" />
              <span>2번 슬라이드</span>
            </a>
          </div>
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=3" />
              <span>3번 슬라이드</span>
            </a>
          </div>
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=4" />
            </a>
          </div>
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=5" />
            </a>
          </div>
          <div class="swiper-slide">
            <a href="">
              <img src="https://picsum.photos/400/500?random=6" />

          </div>
        </div>
        <!-- //swiper-wrapper -->

        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- 9 문제1 컨트롤버트의 위치를 편리하게 잡기위해서 -->
        <div class="swiper-button">
          <!-- If we need navigation buttons -->
          <div class="swiper-button-prev">
            <img src="/myfolder/images/arrow_back_ios_48dp.png" alt="이전슬라이드로 이동">
          </div>
          <div class="swiper-button-next">
            <img src="/myfolder/images/arrow_back_ios_48dp.png" alt="다음슬라이드로 이동">
          </div>
          <!-- play와pause 버튼이 올거예요 -->
           <!-- <div>버</div> -->
           <div class="swiper-button-play-toggle is play">
            <span id="icon-pause" class="icon-pause">pause</span>
            <span id="icon-play" class="icon-play">play</span>
            </div>
          
        </div>  <!-- //.control-button -->

        <!-- If we need scrollbar -->

        <!-- <div class="swiper-scrollbar"></div> -->

    <!-- //.visual-section -->
    <!-- swiper 실행 -->
    <script>
  const swiper1 = new Swiper('.swiper1', {
  // Optional parameters
  direction: 'horizontal',
  loop: true,

  // 현재슬라이드 swiper안에 가운데
  // swipeer 시작할 때 1번 슬라이드 왼쪽에 마지막 슬라이드 표시
  centeredSlides: true,

  // swiper 안에 몇개 slide를 보여줄지 결정
  // 3을 위해서 추가
  slidesPerView: 3,

  // 5여백
  // swiper에서는 아이템간 여백을 marin-right로 지정
  spaceBetween: 20,

  // If we need pagination
  pagination: {
    el: '.swiper-pagination',
    // 7 블릿대신 progressbar
    type : 'progressbar',
    clickable :true,
  },

  // Navigation arrows
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
    // 내가 입력 html img 태그 이미지 사용
    addIcons:false,
  },

  // And if we need scrollbar
  // progressbar일때 삭제
  // scrollbar: {
  //   el: '.swiper-scrollbar',
  // },
});
</script>
